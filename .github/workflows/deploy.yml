name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: rhentify
  ENVIRONMENT: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "api_repo=${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api" >> "$GITHUB_OUTPUT"
          echo "web_repo=${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-web" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: |
          docker build -t ${{ steps.meta.outputs.api_repo }}:latest -t ${{ steps.meta.outputs.api_repo }}:${{ steps.meta.outputs.sha_tag }} .
          docker push ${{ steps.meta.outputs.api_repo }}:latest
          docker push ${{ steps.meta.outputs.api_repo }}:${{ steps.meta.outputs.sha_tag }}

      - name: Build and push Web image
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          docker build -f frontend/Dockerfile frontend \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID" \
            -t ${{ steps.meta.outputs.web_repo }}:latest \
            -t ${{ steps.meta.outputs.web_repo }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.web_repo }}:latest
          docker push ${{ steps.meta.outputs.web_repo }}:${{ steps.meta.outputs.sha_tag }}

      - name: Force ECS rolling deploy (API)
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --service "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api" \
            --force-new-deployment

      - name: Force ECS rolling deploy (Web)
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --service "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-web" \
            --force-new-deployment

      - name: Wait for ECS rollout
        run: |
          cluster="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster"
          services=(
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api"
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-web"
          )

          # Spring Boot cold start + rolling deploy can exceed the default 10m AWS waiter.
          for attempt in $(seq 1 90); do
            stable=true
            for svc in "${services[@]}"; do
              read -r running desired rollout <<< "$(aws ecs describe-services \
                --cluster "$cluster" \
                --services "$svc" \
                --query 'services[0].[runningCount,desiredCount,deployments[0].rolloutState]' \
                --output text)"
              echo "attempt $attempt/90: $svc running=$running desired=$desired rollout=$rollout"
              if [ "$running" != "$desired" ] || [ "$rollout" != "COMPLETED" ]; then
                stable=false
              fi
            done
            if [ "$stable" = true ]; then
              echo "ECS rollout complete."
              exit 0
            fi
            sleep 20
          done

          echo "ECS rollout did not finish within 30 minutes."
          exit 1
